# New, separate vhost. Serves only the per-device JSON files; everything else is 404.
server {
    listen 80;
    listen [::]:80;
    server_name vpncheck.marrecluse.net;

    location /s/ {
        alias /var/lib/vpn-health/public/;
        autoindex off;
        default_type application/json;
        add_header Access-Control-Allow-Origin "https://marrecluse.net" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Server-Time $msec always;
        add_header Access-Control-Expose-Headers "X-Server-Time" always;
        try_files $uri =404;
    }
    location / { return 404; }
}
